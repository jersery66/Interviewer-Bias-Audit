name: Public reproducibility checks

on:
  push:
    branches: ["codex/submission-audit"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install public test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Run code and fixture tests
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: pytest-results.xml
          if-no-files-found: ignore
      - name: Annotate pytest failures
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "pytest-results.xml"
          if not os.path.exists(path):
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          for case in root.findall(".//testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is not None:
                  message = (failure.get("message") or failure.text or "").splitlines()[0]
                  print(f"::error title=pytest failure::{case.get('classname')}.{case.get('name')}: {message}")
          PY
      - name: Verify frozen derived-result integrity
        run: python scripts/verify_submission_artifacts.py
      - name: State the reproduction boundary
        run: |
          echo "CI validates public code/tests and committed derived-result integrity."
          echo "Full data-to-result reproduction requires restricted DAIC-WOZ and private quote-bearing C5 sources."
